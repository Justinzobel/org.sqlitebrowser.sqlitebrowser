app-id: org.sqlitebrowser.sqlitebrowser
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: sqlitebrowser
rename-icon: sqlitebrowser
rename-desktop-file: sqlitebrowser.desktop
rename-appdata-file: sqlitebrowser.desktop.appdata.xml
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --share=network
  - --share=ipc
cleanup:
  - /include
  - '*.la'

modules:
  - tcl.json
  - name: sqlcipher
    buildsystem: autotools
    build-options:
      cflags: >
        -DSQLCIPHER_CRYPTO_OPENSSL
        -DSQLITE_ENABLE_COLUMN_METADATA
        -DSQLITE_ENABLE_FTS3
        -DSQLITE_ENABLE_FTS3_PARENTHESIS
        -DSQLITE_ENABLE_FTS5
        -DSQLITE_ENABLE_GEOPOLY
        -DSQLITE_ENABLE_JSON1
        -DSQLITE_ENABLE_MEMORY_MANAGEMENT=1
        -DSQLITE_ENABLE_RTREE
        -DSQLITE_ENABLE_SNAPSHOT=1
        -DSQLITE_ENABLE_STAT4
        -DSQLITE_HAS_CODEC
        -DSQLITE_SOUNDEX
    config-opts:
      - --enable-tempstore=yes
      - --enable-releasemode
      - --enable-load-extension
      - --disable-static
      - --disable-tcl
      - --with-crypto-lib=openssl
    sources:
      - type: git
        url: https://github.com/sqlcipher/sqlcipher.git
        tag: v4.6.1
        commit: c5bd336ece77922433aaf6d6fe8cf203b0c299d5

  - name: sqlitebrowser
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DFORCE_INTERNAL_QSCINTILLA=TRUE
      - -DQT_MAJOR=Qt6
      - -Dsqlcipher=1
      - -Wno-dev
    sources:
      - type: git
        url: https://github.com/sqlitebrowser/sqlitebrowser.git
        commit: 21dd3b897e65075c445c6d349db87eb908d7a9be
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: appdata.patch
      - type: patch
        path: 94b2f23517e59fdd8dd222989f704bef2c9460a2.patch
